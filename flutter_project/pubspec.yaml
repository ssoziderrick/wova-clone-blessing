name: car_bond_manager
description: Offline-first Car Bond Manager for Ugandan car bonds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  # Local DB (SQLite) + encryption
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  path_provider: ^2.1.3
  # Light key/value
  shared_preferences: ^2.2.3
  # Security
  local_auth: ^2.2.0
  crypto: ^3.0.3
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # Export
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.2
  share_plus: ^9.0.0
  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
